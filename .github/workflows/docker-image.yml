name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless OIDC
  attestations: write # SLSA provenance

env:
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1 — 代码质量与构建检查
  # 触发条件：推送至 main 分支（已排除文档等无关改动）或发起 PR。
  # ───────────────────────────────────────────────────────────────
  verify:
    name: Code verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code (Biome)
        run: pnpm check

      - name: Type-check
        run: pnpm typecheck

      - name: Build (Vite)
        run: pnpm build

  # ───────────────────────────────────────────────────────────────
  # Job 2 — 发布 GitHub Release（前端编译产物 zip，供直接部署 SaaS）
  # 触发条件：推送 vx.y.z 格式的 Git Tag。
  # ───────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend SPA
        run: pnpm build

      - name: Package dist artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist && zip -r "../vodhub-dist-${TAG}.zip" . && cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "vodhub-dist-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes

  # ───────────────────────────────────────────────────────────────
  # Job 3 — 多架构 Docker 镜像构建、推送 GHCR 与 Cosign 签名
  # 触发条件：推送 vx.y.z 格式的 Git Tag（或手动触发）。
  # ───────────────────────────────────────────────────────────────
  docker:
    name: Docker build & push
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        id: img
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: docker buildx imagetools inspect "${IMAGE}:latest"

      - name: Job summary
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}:latest\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Pull | \`docker pull ${IMAGE}:latest\` |"
            echo "| Signed | cosign keyless (OIDC) |"
            echo "| SBOM | embedded |"
            echo "| Provenance | SLSA mode=max |"
          } >> "$GITHUB_STEP_SUMMARY"
